name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore Renmei.slnx

      - name: Build
        run: dotnet build Renmei.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Renmei.slnx -c Release --no-build --verbosity normal