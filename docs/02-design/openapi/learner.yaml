# Bảo mật
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unauthorized:
      description: Chưa đăng nhập hoặc token hết hạn
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden:
      description: Không đủ quyền truy cập hoặc bị chặn
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Không tìm thấy dữ liệu người dùng
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict:
      description: Vi phạm quy tắc nghiệp vụ hoặc đã có người đã đăng ký trước (trùng email))
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    TooManyRequests:
      description: Gửi request vượt quá giới hạn
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'


# Định nghĩa các kiểu dữ liệu
  schemas:
    ProblemDetails:
      type: object
      properties:
        type: *id008
        title: *id008
        status: *id006
        detail: *id008
        errors:
          type: object
          additionalProperties:
            type: array
            items: *id008
      required:
      - title
      - status
      description: RFC 7807
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName: *id008
      required:
      - email
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password: *id008
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken: *id008
      required:
      - refreshToken
    TokenResponse:
      type: object
      properties:
        accessToken: *id008
        refreshToken: *id008
        expiresInSeconds: *id006
        user:
          $ref: '#/components/schemas/UserProfile'
      required:
      - accessToken
      - refreshToken
      - expiresInSeconds
    TokenRequest:
      type: object
      properties:
        token: *id008
      required:
      - token
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResetPasswordRequest:
      type: object
      properties:
        token: *id008
        newPassword:
          type: string
          minLength: 8
      required:
      - token
      - newPassword
    UserProfile:
      type: object
      properties:
        id: *id007
        email: *id008
        displayName: *id008
        currentLevel:
          type: integer
          minimum: 1
          maximum: 5
          description: 5, 4, 3, 2, 1 = N5, N4, N3, N2, N1
        dailyNewCardGoal: *id006
        timeZone: *id008
        preferredStudyTime:
          type: string
          example: '20:00'
        emailConfirmed: *id013
    UpdateProfileRequest:
      type: object
      properties:
        displayName: *id008
        dailyNewCardGoal: *id006
        timeZone: *id008
        preferredStudyTime: *id008
        currentLevel: *id006
    Reading:
      type: object
      properties:
        type:
          type: string
          enum:
          - 'On'
          - Kun
        kana: *id008
        romaji: *id008
    Meaning:
      type: object
      properties:
        language:
          type: string
          enum:
          - vi
          - en
        type:
          type: string
          enum:
          - HanViet
          - Meaning
        text: *id008
    ExampleWord:
      type: object
      properties:
        word: *id008
        reading: *id008
        meaningVi: *id008
        sentenceJa: *id008
    KanjiSummary:
      type: object
      properties:
        id: *id006
        character: *id008
        jlptLevel: *id006
        hanViet:
          type: array
          items: *id008
    KanjiDetail:
      type: object
      properties:
        id: *id006
        character: *id008
        jlptLevel: *id006
        strokeCount: *id006
        radical: *id008
        mnemonicVi: *id008
        mnemonicImageUrl: *id008
        strokeOrderGifUrl: *id008
        audioUrl: *id008
        readings:
          type: array
          items:
            $ref: '#/components/schemas/Reading'
        meanings:
          type: array
          items:
            $ref: '#/components/schemas/Meaning'
        exampleWords:
          type: array
          items:
            $ref: '#/components/schemas/ExampleWord'
        state:
          type: string
          enum:
          - New
          - Learning
          - Review
          - Mastered
    PagedKanji:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KanjiSummary'
        page: *id006
