openapi: 3.0.3
info:
  title: Renmei Core Learning API Specification
  description: Mọi điểm cuối trừ nhóm Auth công khai cần Bearer JWT. Mỗi thao tác có `x-requirements` liệt kê mã yêu cầu để lập RTM. Bản thiết kế chưa được kiểm chứng bằng code.
  version: 1.1.0
servers:
  - url: https://api.renmei.app/v1
    description: Production Server
  - url: http://localhost:5000/v1
    description: Local Development Server

security:
- bearerAuth: []
tags:
- name: Auth
  description: Đăng ký, đăng nhập, token
- name: Me
  description: Hồ sơ cá nhân
- name: Kanji
  description: Nội dung Kanji đã xuất bản
- name: Placement-test
  description: Kiểm tra trình độ đầu vào
- name: Learning
  description: Hàng đợi và ôn tập SM-2
- name: Stats
  description: Thống kê và chuỗi ngày học
- name: Feedback
  description: Báo lỗi và góp ý
- name: Dialogue
  description: Hội thoại tình huống
- name: Arena
  description: 'Đấu trường: ván chơi, trận, bảng xếp hạng'
- name: Raids
  description: Boss Raid
- name: Cases
  description: Vụ án Kanji
- name: Shadowing
  description: Shadowing Voice Battle
- name: Friends
  description: Hồ sơ, kết bạn, cài đặt riêng tư
- name: Chats
  description: Nhắn tin riêng giữa bạn bè
- name: Invitations
  description: Lời mời thi đấu và lời mời phòng
- name: Rooms
  description: Phòng chơi nhiều người
- name: Notifications
  description: Thông báo
- name: Safety
  description: Chặn và báo cáo

# Xác thực tài khoản
paths:
  /api/auth/register:
    post:
      tags:
      - Auth
      operationId: register
      summary: Đăng ký tài khoản
      x-requirements:
      - FR-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '409': &id012
          $ref: '#/components/responses/Conflict'
        '429': &id002
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /api/auth/login:
    post:
      tags:
      - Auth
      operationId: login
      summary: Đăng nhập, nhận JWT
      x-requirements:
      - FR-001
      description: Sai mật khẩu trả 401.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': *id001
        '429': *id002
        '401': &id003
          $ref: '#/components/responses/Unauthorized'
      security: []
  /api/auth/refresh:
    post:
      tags:
      - Auth
      operationId: refreshToken
      summary: Làm mới token
      x-requirements:
      - FR-001
      - NFR-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': *id001
        '429': *id002
      security: []
  /api/auth/logout:
    post:
      tags:
      - Auth
      operationId: logout
      summary: Đăng xuất, thu hồi refresh token
      x-requirements:
      - FR-001
      - NFR-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Thành công, không có nội dung
        '400': *id001
        '401': *id003
        '403': &id005
          $ref: '#/components/responses/Forbidden'
        '404': &id004
          $ref: '#/components/responses/NotFound'
        '429': *id002
  /api/auth/verify-email:
    post:
      tags:
      - Auth
      operationId: verifyEmail
      summary: Xác minh email
      x-requirements:
      - NFR-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Thành công, không có nội dung
        '400': *id001
        '404': *id004
        '429': *id002
      security: []
  /api/auth/forgot-password:
    post:
      tags:
      - Auth
      operationId: forgotPassword
      summary: Yêu cầu đặt lại mật khẩu
      x-requirements:
      - NFR-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: Thành công, không có nội dung
        '400': *id001
        '429': *id002
      security: []
  /api/auth/reset-password:
    post:
      tags:
      - Auth
      operationId: resetPassword
      summary: Đặt lại mật khẩu
      x-requirements:
      - NFR-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Thành công, không có nội dung
        '400': *id001
        '404': *id004
        '429': *id002
      security: []
  /api/me:
    get:
      tags:
      - Me
      operationId: getMe
      summary: Xem hồ sơ của tôi
      x-requirements:
      - FR-001
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002


# Hồ sơ cá nhân, cài đặt, mục tiêu học tập, chuỗi ngày học
    patch:
      tags:
      - Me
      operationId: updateMe
      summary: Cập nhật mục tiêu ngày, múi giờ, giờ học ưu tiên
      x-requirements:
      - FR-004
      - FR-006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
    delete:
      tags:
      - Me
      operationId: deleteMyAccount
      summary: Xóa tài khoản và ẩn danh dữ liệu
      x-requirements:
      - NFR-008
      - FR-011
      responses:
        '202':
          description: Thành công, không có nội dung
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002

# Nội dung Kanji đã xuất bản, danh sách, chi tiết, media
  /api/kanji:
    get:
      tags:
      - Kanji
      operationId: listKanji
      summary: Danh sách Kanji đã xuất bản
      x-requirements:
      - FR-005
      parameters:
      - &id009
        name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      - &id010
        name: pageSize
        in: query
        required: false
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: level
        in: query
        required: false
        schema: &id006
          type: integer
      - name: q
        in: query
        required: false
        schema: &id008
          type: string
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedKanji'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/kanji/{id}:
    get:
      tags:
      - Kanji
      operationId: getKanji
      summary: Chi tiết Kanji kèm media
      x-requirements:
      - FR-005
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KanjiDetail'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002

#FR-002: Kiểm tra trình độ đầu vào

  /api/placement-test/attempts:
    post:
      tags:
      - Placement-test
      operationId: startPlacementTest
      summary: Bắt đầu bài kiểm tra đầu vào
      x-requirements:
      - FR-002
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementAttempt'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/placement-test/attempts/{attemptId}/submit:
    post:
      tags:
      - Placement-test
      operationId: submitPlacementTest
      summary: Nộp bài, nhận điểm bắt đầu gợi ý
      x-requirements:
      - FR-002
      parameters:
      - name: attemptId
        in: path
        required: true
        schema: &id007
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlacementSubmitRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlacementResult'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/placement-test/skip:
    post:
      tags:
      - Placement-test
      operationId: skipPlacementTest
      summary: Bỏ qua, bắt đầu từ N5
      x-requirements:
      - FR-002
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/me/level:
    put:
      tags:
      - Placement-test
      operationId: chooseLevel
      summary: Tự chọn trình độ bắt đầu
      x-requirements:
      - FR-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChooseLevelRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002

# Học tập, ôn tập, SM-2, hàng đợi, chuỗi ngày học
  /api/queue/today:
    get:
      tags:
      - Learning
      operationId: getDailyQueue
      summary: Hàng đợi học hằng ngày
      x-requirements:
      - FR-004
      description: 'Thứ tự: chữ quên hoặc quá hạn, ôn đúng hạn, chữ mới.'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyQueue'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/learning/start:
    post:
      tags:
      - Learning
      operationId: startLearningNewKanji
      summary: Bắt đầu học chữ mới
      x-requirements:
      - FR-004
      - FR-005
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartLearningRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyQueue'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/reviews:
    post:
      tags:
      - Learning
      operationId: submitReview
      summary: Chấm một lượt ôn
      x-requirements:
      - FR-003
      - FR-006
      description: Gửi lại cùng clientEventId không tạo bản ghi mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResult'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/reviews/batch:
    post:
      tags:
      - Learning
      operationId: submitReviewBatch
      summary: Gửi nhiều lượt ôn khi có mạng lại
      x-requirements:
      - FR-003
      - NFR-003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewBatchRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewBatchResult'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002


# Thống kê học tập, chuỗi ngày học
  /api/stats/summary:
    get:
      tags:
      - Stats
      operationId: getStatsSummary
      summary: Thống kê học tập
      x-requirements:
      - FR-004
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSummary'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/streak:
    get:
      tags:
      - Stats
      operationId: getStreak
      summary: Chuỗi ngày học và StreakFreeze
      x-requirements:
      - FR-006
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakStatus'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002

# Báo lỗi nội dung, góp ý, phản hồi
  /api/feedback:
    post:
      tags:
      - Feedback
      operationId: sendFeedback
      summary: Báo lỗi nội dung hoặc góp ý
      x-requirements:
      - FR-012
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002

# Hội thoại tình huống, kịch bản, phản hồi
  /api/dialogues/scenarios:
    get:
      tags:
      - Dialogue
      operationId: listDialogueScenarios
      summary: Kịch bản hội thoại theo bài học
      x-requirements:
      - FR-007
      parameters:
      - name: level
        in: query
        required: false
        schema: *id006
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DialogueScenario'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/dialogues/sessions:
    post:
      tags:
      - Dialogue
      operationId: startDialogue
      summary: Bắt đầu hội thoại
      x-requirements:
      - FR-007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scenarioId: *id006
              required:
              - scenarioId
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogueSession'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/dialogues/sessions/{id}/messages:
    post:
      tags:
      - Dialogue
      operationId: sendDialogueMessage
      summary: Gửi câu trả lời và nhận phản hồi
      x-requirements:
      - FR-007
      parameters:
      - name: id
        in: path
        required: true
        schema: *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DialogueMessageRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DialogueReply'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/dialogues/sessions/{id}/skip:
    post:
      tags:
      - Dialogue
      operationId: skipDialogue
      summary: Bỏ qua, hoàn thành bài
      x-requirements:
      - FR-007
      parameters:
      - name: id
        in: path
        required: true
        schema: *id007
      responses:
        '204':
          description: Thành công, không có nội dung
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002

# Đấu trường: ván chơi, trận, bảng xếp hạng
  /api/games:
    get:
      tags:
      - Arena
      operationId: listGames
      summary: Danh sách trò chơi và khả dụng theo cấp độ
      x-requirements:
      - FR-020
      parameters:
      - name: level
        in: query
        required: false
        schema: *id006
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GameMode'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/games/profile:
    get:
      tags:
      - Arena
      operationId: getGameProfile
      summary: Hồ sơ người chơi của tôi
      x-requirements:
      - FR-022
      - FR-033
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
    put:
      tags:
      - Arena
      operationId: updateGameProfile
      summary: Đặt biệt danh, ẩn khỏi bảng xếp hạng
      x-requirements:
      - FR-022
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGameProfileRequest'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameProfile'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/games/{gameCode}/sessions:
    post:
      tags:
      - Arena
      operationId: startGameSession
      summary: Bắt đầu ván
      x-requirements:
      - FR-020
      - FR-021
      - FR-023
      - FR-024
      - FR-025
      - FR-026
      - FR-027
      - FR-028
      - FR-029
      - NFR-006
      parameters:
      - name: gameCode
        in: path
        required: true
        schema: *id008
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
      responses:
        '201':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSession'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/game-sessions/{sessionId}/events:
    post:
      tags:
      - Arena
      operationId: sendGameEvents
      summary: Server chấm điểm
      x-requirements:
      - NFR-006
      - NFR-009
      parameters:
      - name: sessionId
        in: path
        required: true
        schema: *id007
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameEventBatch'
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameEventAck'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/game-sessions/{sessionId}/complete:
    post:
      tags:
      - Arena
      operationId: completeGameSession
      summary: Kết thúc ván, nhận kết quả do Server tính
      x-requirements:
      - FR-020
      - FR-021
      - NFR-006
      parameters:
      - name: sessionId
        in: path
        required: true
        schema: *id007
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResult'
        '400': *id001
        '401': *id003
        '403': *id005
        '404': *id004
        '429': *id002
  /api/matches:
    get:
      tags:
